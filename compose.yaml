services:
  go:
    build: 
      dockerfile: Dockerfile
      context: .
    user: go
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    working_dir: /home/go
    tty: true
    stdin_open: true
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:23234:23234"
      - "127.0.0.1:23235:23235"
    volumes:
      - .:/home/go
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "127.0.0.1:8025:8025"

  db:
    image: postgres:17-alpine
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 30s
      retries: 5
      start_period: 30s

volumes:
  pgdata: